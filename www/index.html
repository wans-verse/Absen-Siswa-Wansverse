<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absen Wajah</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#8e8e93;--sep:#c6c6c8;--blue:#007aff;--green:#34c759;--red:#ff3b30;--org:#ff9500;--seg:#7676801f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--org:#ff9f0a;--seg:#7676803d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--org:#ff9f0a;--seg:#7676803d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:12px 16px 24px}
h1{font-size:32px;margin:8px 0 12px;letter-spacing:-.5px}
h3{font-size:13px;color:var(--tx2);text-transform:uppercase;font-weight:500;margin:18px 12px 6px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.row:last-child{border:0}.row .g{flex:1;min-width:0}.row small{color:var(--tx2);display:block;font-size:13px}
.row.c{flex-wrap:wrap}.row.c>input,.row.c>select{flex-basis:100%;margin:0}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:7px 4px;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 4px #0002}
.btn{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:600;width:100%}
.btn.s{background:var(--seg);color:var(--blue)}.btn.r{background:var(--red);color:#fff}
.btns{display:flex;gap:8px;margin:10px 0}
nav{display:flex;border-top:.5px solid var(--sep);background:var(--card);padding-bottom:4px}
nav button{flex:1;border:0;background:none;color:var(--tx2);padding:8px 0 4px;font-size:11px}
nav button svg{display:block;margin:0 auto 3px}nav button.on{color:var(--blue)}
input,select{width:100%;font-size:16px;padding:11px 12px;border-radius:10px;border:0;background:var(--card);color:var(--tx);margin-bottom:8px}
.card input,.card select{background:var(--bg)}
input[type=range]{padding:0;background:none!important;margin:4px 0 0;accent-color:var(--blue)}
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:#aaa;text-align:center}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ring{position:absolute;width:58%;aspect-ratio:3/4;border:3px solid #fff9;border-radius:50%}
.scanline{position:absolute;left:21%;width:58%;height:3px;top:21%;border-radius:3px;background:var(--blue);box-shadow:0 0 14px 3px var(--blue);display:none;pointer-events:none}
.cam.busy .scanline{display:block;animation:sl .6s ease-in-out infinite alternate}
@keyframes sl{from{top:21%}to{top:79%}}
.ring{transition:border-color .15s,box-shadow .15s}
.cam.busy .ring{border-color:var(--blue)}
.cam.ok .ring{border-color:var(--green);box-shadow:0 0 24px var(--green)}
.cam.no .ring{border-color:var(--red);box-shadow:0 0 24px var(--red)}
.cam.dup .ring{border-color:var(--org);box-shadow:0 0 24px var(--org)}
.hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 4px #000a;pointer-events:none}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none}
.cam.ok .flash{background:var(--green)}.cam.no .flash{background:var(--red)}.cam.dup .flash{background:var(--org)}
.cam.fl .flash{animation:fl .4s ease-out}
@keyframes fl{from{opacity:.55}to{opacity:0}}
.std{position:absolute;bottom:-6px;width:2px;height:10px;background:var(--tx2);border-radius:1px;pointer-events:none}
.lim{flex-basis:100%;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--tx2);margin-top:10px}
.lim button{border:0;background:none;color:var(--blue);font-size:12px;padding:0}
.row.c>.sel{flex-basis:100%;margin:0}
.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-radius:12px;padding:12px 14px;margin-bottom:8px;background:var(--card);color:var(--tx);font-size:16px;text-align:left}
.card .sel{background:var(--bg)}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sel .ph{color:var(--tx2)}
.sel svg{flex:none;color:var(--tx2)}
.stb{border:0;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:4px;flex:none}
.stb.N{background:var(--seg);color:var(--tx2)}
.ov{position:fixed;inset:0;background:#0007;z-index:20;opacity:0;transition:opacity .22s}.ov.on{opacity:1}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:auto;background:var(--card);color:var(--tx);border-radius:22px 22px 0 0;z-index:21;max-height:75vh;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sh.on{transform:none}
.sh .grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:8px auto 4px;flex:none}
.sh h4{margin:0;text-align:center;font-size:13px;color:var(--tx2);font-weight:600;padding:6px 16px 10px;flex:none}
.sh .ls{overflow-y:auto;padding:0 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--tx);padding:15px 12px;font-size:17px;text-align:left;border-top:.5px solid var(--sep)}
.opt:first-child{border-top:0}
.opt:active{background:var(--seg);border-radius:10px}
.opt.on{color:var(--blue);font-weight:600}
.opt i{width:12px;height:12px;border-radius:50%;flex:none}
.opt .ck{margin-left:auto}
.sh .cn{margin:8px 12px 0;border:0;border-radius:14px;background:var(--seg);color:var(--blue);font-size:17px;font-weight:600;padding:14px;flex:none}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s,transform .45s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash svg{width:170px;height:204px;overflow:visible}
.sp-r{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spd .75s ease-out .1s forwards,spg .35s ease 1.55s forwards}
@keyframes spd{to{stroke-dashoffset:0}}
@keyframes spg{to{stroke:var(--green);filter:drop-shadow(0 0 8px var(--green))}}
.sp-f{fill:var(--tx2);stroke:var(--tx2);stroke-width:4;stroke-linecap:round;opacity:0;animation:spi .5s ease .55s forwards,spo .3s ease 1.5s forwards}
.sp-f.m{fill:none}
@keyframes spi{to{opacity:.55}}@keyframes spo{from{opacity:.55}to{opacity:.1}}
.sp-s{fill:var(--blue);opacity:0;filter:drop-shadow(0 0 6px var(--blue));animation:sps .7s ease-in-out .85s forwards}
@keyframes sps{0%{opacity:0;transform:translateY(24px)}12%{opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(196px)}}
.sp-c{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:spd .35s ease-out 1.6s forwards}
.sp-t{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:26px;opacity:0;transform:translateY(10px);animation:spu .5s ease 1.7s forwards}
.sp-u{font-size:14px;color:var(--tx2);margin-top:4px;opacity:0;animation:spu .5s ease 1.85s forwards}
@keyframes spu{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;color:#fff;font-weight:600}
.H{background:var(--green)}.I{background:var(--blue)}.S{background:var(--org)}.A{background:var(--red)}
.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:488px;margin:auto;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 8px 30px #0004;z-index:9;display:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{border:0;border-radius:99px;padding:7px 14px;background:var(--card);color:var(--tx);white-space:nowrap;font-size:14px}
.chips button.on{background:var(--blue);color:#fff}
.back{color:var(--blue);border:0;background:none;font-size:17px;padding:4px 0}
.sm{font-size:13px;color:var(--tx2);padding:0 12px}
select.st{width:auto;margin:0;padding:6px;font-size:13px}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;flex:none}
.dot.ok{background:var(--green)}.dot.no{background:var(--org)}
.okt{color:var(--green);font-weight:600}.not{color:var(--org);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--seg);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
details.card summary{padding:14px 16px;color:var(--blue);font-weight:600;list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--seg);transition:.2s;pointer-events:none}
.sw i:before{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:.2s}
.sw input:checked+i{background:var(--green)}.sw input:checked+i:before{transform:translateX(20px)}
.sws{display:flex;gap:14px;padding:6px 16px 14px;align-items:center}
.sws button{width:32px;height:32px;border-radius:50%;border:2px solid var(--card);padding:0}
.sws button.on{box-shadow:0 0 0 2px var(--tx2)}
</style></head><body>
<div id="app"><main id="v"></main>
<nav>
<button data-t="absen"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M9.5 15c1.5 1.3 3.5 1.3 5 0"/></svg>Absen</button>
<button data-t="kelas"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 1h13v-3M9 8h6"/></svg>Kelas</button>
<button data-t="siswa"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4.5 2 4.5 4.5"/></svg>Siswa</button>
<button data-t="rekap"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Rekap</button>
<button data-t="setting"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Setting</button>
</nav></div>
<div class="toast" id="toast"></div>
<div id="splash"><svg viewBox="0 0 170 204" aria-hidden="true"><defs><clipPath id="spcp"><ellipse cx="85" cy="102" rx="68" ry="88"/></clipPath></defs>
<ellipse class="sp-r" cx="85" cy="102" rx="68" ry="88" pathLength="1"/>
<circle class="sp-f" cx="62" cy="88" r="5"/><circle class="sp-f" cx="108" cy="88" r="5"/><path class="sp-f m" d="M60 124Q85 146 110 124"/>
<g clip-path="url(#spcp)"><rect class="sp-s" x="10" y="0" width="150" height="4" rx="2"/></g>
<path class="sp-c" d="M56 104L78 126L116 80" pathLength="1"/></svg>
<div class="sp-t">Absen Wajah</div><div class="sp-u">Presensi cepat, tanpa kartu</div></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const jam=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const ST={H:'Hadir',I:'Izin',S:'Sakit',A:'Alpa'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Data ---------- */
const DEF={theme:'auto',accent:'',thK:80,thS:88,detect:true,auto:false,cool:3,gap:2,
 snd:{on:true,voice:'',rate:1,pitch:1,vol:1,hadir:true,dup:true,gagal:true,
  tHadir:'{nama}, hadir',tDup:'{nama}, sudah absen',tGagal:'Wajah tidak dikenali'}};
// [min, maks, standar]
const LIM={thK:[65,95,80],thS:[70,95,88],gap:[0,5,2]};
function norm(o){
 o=o&&typeof o==='object'?o:{};
 const d={students:Array.isArray(o.students)?o.students:[],att:Array.isArray(o.att)?o.att:[],classes:Array.isArray(o.classes)?o.classes:[],set:o.set||{}};
 // buang data contoh/palsu bawaan versi lama
 const demo=new Set();
 d.students=d.students.filter(s=>{const m=/^s([0-2])([0-5])$/.exec(s.id||'');const x=m&&s.nis==='2024'+m[1]+'0'+m[2];if(x)demo.add(s.id);return!x});
 d.att=d.att.filter(a=>!demo.has(a.sid)&&a.via!=='simulasi');
 d.students.forEach(s=>{if(s.cls&&!d.classes.includes(s.cls))d.classes.push(s.cls)});
 d.set=Object.assign({},DEF,d.set,{snd:Object.assign({},DEF.snd,d.set.snd)});
 Object.keys(LIM).forEach(k=>{const v=+d.set[k];d.set[k]=isNaN(v)?LIM[k][2]:Math.min(LIM[k][1],Math.max(LIM[k][0],v))});
 return d;
}
const save=()=>{try{localStorage.setItem('absen',JSON.stringify(DB))}catch(e){}};
let DB=norm(null);
try{DB=norm(JSON.parse(localStorage.getItem('absen')||'null'))}catch(e){}
save();
const cf=()=>DB.set;
const classes=()=>[...DB.classes].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
const inCls=c=>DB.students.filter(s=>s.cls===c);
const faceCount=a=>a.filter(s=>s.vec).length;
const byName=(a,b)=>a.name.localeCompare(b.name,'id');
const fill=(t,s)=>String(t).replace(/\{nama\}/gi,s.name).replace(/\{kelas\}/gi,s.cls);
let enrollId=null;
let S={tab:'absen',mode:'kelas',cls:null,stream:null,rc:'all',rd:'today',sc:'all',sf:'all',sq:'',addOpen:false,addCls:''};

const CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>';
const CHK='<svg class="ck" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
// tombol pilihan; isinya dipilih lewat lembar (sheet) dari bawah
function selBtn(id,val,label,ph){return`<button type="button" class="sel" id="${id}" data-v="${esc(val)}"><span class="${label?'':'ph'}">${esc(label||ph)}</span>${CHEV}</button>`}
function sheet(title,opts,cur){
 return new Promise(res=>{
  const ov=document.createElement('div');ov.className='ov';
  const sh=document.createElement('div');sh.className='sh';
  sh.innerHTML=`<div class="grab"></div><h4>${esc(title)}</h4><div class="ls">${opts.map((o,i)=>`<button class="opt ${o.v===cur?'on':''}" data-i="${i}">${o.c?`<i style="background:${o.c}"></i>`:''}<span>${esc(o.l)}</span>${o.v===cur?CHK:''}</button>`).join('')}</div><button class="cn">Batal</button>`;
  document.body.append(ov,sh);
  requestAnimationFrame(()=>{ov.classList.add('on');sh.classList.add('on')});
  const cur_=sh.querySelector('.opt.on');if(cur_)cur_.scrollIntoView({block:'center'});
  let done=false;
  const close=v=>{if(done)return;done=true;ov.classList.remove('on');sh.classList.remove('on');setTimeout(()=>{ov.remove();sh.remove()},300);res(v)};
  ov.onclick=()=>close(undefined);sh.querySelector('.cn').onclick=()=>close(undefined);
  sh.querySelectorAll('.opt').forEach(b=>b.onclick=()=>close(opts[+b.dataset.i].v));
 });
}
function bindSel(id,title,getOpts,onPick){
 const b=$('#'+id);if(!b)return;
 b.onclick=async()=>{const o=getOpts(),v=await sheet(title,o,b.dataset.v);if(v===undefined)return;
  b.dataset.v=v;const f=o.find(x=>x.v===v),sp=b.querySelector('span');sp.textContent=f?f.l:'';sp.classList.remove('ph');if(onPick)onPick(v)};
}
function toast(h,ms=2800){const t=$('#toast');t.innerHTML=h;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',ms)}
function stopCam(){clearInterval(autoT);autoT=null;busy=false;if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}}
function render(){
 if(S.tab!=='absen'||!(S.mode==='sekolah'||S.cls))if(!(S.tab==='siswa'&&enrollId))stopCam();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
 ({absen:vAbsen,kelas:vKelas,siswa:vSiswa,rekap:vRekap,setting:vSetting})[S.tab]();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;enrollId=null;stopCam();$('#v').scrollTop=0;render()});

/* ---------- Tema ---------- */
function applyTheme(){
 const r=document.documentElement;
 if(cf().theme==='auto')r.removeAttribute('data-theme');else r.dataset.theme=cf().theme;
 if(cf().accent)r.style.setProperty('--blue',cf().accent);else r.style.removeProperty('--blue');
}

/* ---------- Suara ---------- */
const TTSP=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech;
let VOICES=[];
async function loadVoices(){
 try{
  if(TTSP()){const r=await TTSP().getSupportedVoices();VOICES=(r.voices||[]).map((v,i)=>({k:v.name+'|'+v.lang,name:v.name,lang:v.lang,i}))}
  else if('speechSynthesis' in window){VOICES=speechSynthesis.getVoices().map((v,i)=>({k:v.name+'|'+v.lang,name:v.name,lang:v.lang,i,o:v}))}
 }catch(e){}
 VOICES.sort((a,b)=>(/^id/i.test(b.lang)-/^id/i.test(a.lang))||a.name.localeCompare(b.name));
 const sel=$('#vs span');if(sel&&S.tab==='setting')sel.textContent=voiceLabel();
}
function voiceOpts(){return[{v:'',l:'Otomatis (bahasa Indonesia)'}].concat(VOICES.map(v=>({v:v.k,l:v.name+' · '+v.lang})))}
function voiceLabel(){const f=voiceOpts().find(o=>o.v===cf().snd.voice);return f?f.l:'Otomatis (bahasa Indonesia)'}
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;
loadVoices();setTimeout(loadVoices,1500);
function speak(t){
 const c=cf().snd;if(!c.on||!t)return;
 const v=VOICES.find(x=>x.k===c.voice)||(c.voice?null:VOICES.find(x=>/^id/i.test(x.lang)));
 const T=TTSP();
 if(T){try{T.stop();const o={text:t,lang:'id-ID',rate:c.rate,pitch:c.pitch,volume:c.vol,category:'ambient'};if(v)o.voice=v.i;Promise.resolve(T.speak(o)).catch(()=>{})}catch(e){}return}
 if(!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=c.rate;u.pitch=c.pitch;u.volume=c.vol;if(v&&v.o)u.voice=v.o;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- Pencocokan wajah (on-device, ringan) ---------- */
function vecFrom(src){
 const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
 const w=src.videoWidth,h=src.videoHeight,s=Math.min(w,h)*.6;
 x.drawImage(src,(w-s)/2,(h-s)/2-h*.03,s,s,0,0,16,16);
 const d=x.getImageData(0,0,16,16).data,v=[];let m=0;
 for(let i=0;i<d.length;i+=4){const g=.3*d[i]+.59*d[i+1]+.11*d[i+2];v.push(g);m+=g}
 m/=v.length;let n=0;v.forEach((g,i)=>{v[i]=g-m;n+=v[i]*v[i]});n=Math.sqrt(n)||1;

}
const cos=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
function match(v,pool){
 let best=null,sc=-1,second=-1;
 pool.filter(s=>s.vec).forEach(s=>{const c=cos(v,s.vec);if(c>sc){second=sc;sc=c;best=s}else if(c>second)second=c});
 return{best,sc,second};
}
const TH=()=>(S.mode==='kelas'?cf().thK:cf().thS)/100;

 const dup=a&&a.st==='H'&&status==='H';
 if(a){if(!dup){a.st=status;a.time=jam();a.via=via}}
 else DB.att.push({sid:s.id,date:d,time:jam(),st:status,via});

}
async function startCam(){

  const v=$('#vid');if(!v){stopCam();return}v.srcObject=S.stream;v.style.display='block';$('#camMsg').style.display='none'}

/* ---------- Deteksi wajah, efek & scan otomatis ---------- */
let busy=false,coolUntil=0,needLeave=false,leaveMax=0,autoT=null,fd=null,noFD=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function buzz(k){try{navigator.vibrate&&navigator.vibrate(k==='ok'?60:k==='dup'?[40,60,40]:[120,60,120])}catch(e){}}
function fx(k){
 const c=$('.cam');if(!c)return;
 c.classList.remove('busy','ok','no','dup','fl');void c.offsetWidth;
 const hn=$('#hint');if(hn)hn.textContent=k==='busy'?'Memindai… tahan sebentar':'Posisikan wajah di dalam cincin';
 if(k==='busy'){c.classList.add('busy');return}

// perkiraan: ada kulit + tekstur di dalam cincin (cadangan bila FaceDetector bawaan tidak ada)
function skinFace(v){
 const w=v.videoWidth,h=v.videoHeight,vw=w/h>.75?h*.75:w,vh=w/h>.75?h:w/.75;
 const rw=.58*vw,rh=.58*vh,W=24,H=32;
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage(v,(w-rw)/2,(h-rh)/2,rw,rh,0,0,W,H);
 const d=x.getImageData(0,0,W,H).data;let n=0,sk=0,sum=0,sq=0;
 for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){
  if(((xx-W/2+.5)/(W/2))**2+((yy-H/2+.5)/(H/2))**2>1)continue;
  const k=(yy*W+xx)*4,r=d[k],g=d[k+1],b=d[k+2];
  const Y=.299*r+.587*g+.114*b,Cb=128-.169*r-.331*g+.5*b,Cr=128+.5*r-.419*g-.081*b;
  n++;sum+=Y;sq+=Y*Y;
  if(Y>35&&Cb>=77&&Cb<=127&&Cr>=133&&Cr<=173)sk++;
 }
 const m=sum/n,sd=Math.sqrt(Math.max(0,sq/n-m*m));
 return sk/n>=.25&&sd>=14;
}
async function hasFace(v){
 if(!cf().detect)return true;
 if('FaceDetector' in window&&!noFD){
  try{fd=fd||new FaceDetector({fastMode:true,maxDetectedFaces:1});
   const f=await fd.detect(v);if(!f.length)return false;
   const b=f[0].boundingBox,w=v.videoWidth,h=v.videoHeight;
   return Math.abs(b.x+b.width/2-w/2)<w*.25&&Math.abs(b.y+b.height/2-h/2)<h*.3&&b.width>Math.min(w,h)*.15;
  }catch(e){noFD=true;fd=null}
 }
 return skinFace(v);
}
async function scan(auto){
 if(busy)return;
 const v=$('#vid');
 if(!S.stream||!v||!v.videoWidth)return auto?0:toast('Kamera belum aktif');
 const p=pool();
 if(!p.some(s=>s.vec))return auto?0:toast('Belum ada siswa terdaftar di '+(S.mode==='kelas'?esc(S.cls):'sekolah')+'. Daftarkan di tab Siswa.');
 busy=true;
 try{
  if(!(await hasFace(v))){
   needLeave=false;
   if(!auto){fx('no');toast('<b>Wajah tidak terdeteksi</b><br><small style="color:var(--tx2)">Arahkan wajah ke dalam cincin, lalu coba lagi.</small>')}
   return;
  }
  fx('busy');await sleep(auto?450:650);
  if(!$('#vid'))return;
  const r=match(vecFrom(v),p),n=cf().snd,cd=cf().cool*1000;
  const gapOK=r.second<0||r.sc-r.second>=cf().gap/100;
  if(r.best&&r.sc>=TH()&&gapOK){
   const dup=mark(r.best);
   fx(dup?'dup':'ok');
   toast(`<b>${dup?'Sudah absen':'Hadir'}</b><br>${esc(r.best.name)} · ${esc(r.best.cls)}<br><small style="color:var(--tx2)">Kecocokan ${(r.sc*100).toFixed(0)}% · ${p.length} kandidat</small>`);
   if(dup){if(n.dup)speak(fill(n.tDup,r.best))}else if(n.hadir)speak(fill(n.tHadir,r.best));
   list();coolUntil=Date.now()+cd;needLeave=true;leaveMax=Date.now()+cd*3;
  }else{
   fx('no');
   if(!auto&&n.gagal)speak(n.tGagal);
   toast(r.best&&r.sc>=TH()
    ?`<b>Terlalu mirip siswa lain</b><br><small style="color:var(--tx2)">Skor ${(r.sc*100).toFixed(0)}% tapi selisih dengan kandidat kedua hanya ${((r.sc-r.second)*100).toFixed(1)}% (min ${cf().gap}%). Atur di Setting → Pencocokan wajah.</small>`
    :`<b>Wajah tidak dikenali</b><br><small style="color:var(--tx2)">Skor tertinggi ${(Math.max(r.sc,0)*100).toFixed(0)}% (min ${(TH()*100).toFixed(0)}%). Coba lagi / absen manual.</small>`);
   coolUntil=Date.now()+(auto?1500:0);
  }
 }finally{busy=false}
}
function autoLoop(){
 clearInterval(autoT);autoT=null;
 if(!cf().auto||S.tab!=='absen')return;
 autoT=setInterval(async()=>{
  if(busy||!S.stream||Date.now()<coolUntil)return;
  const v=$('#vid');if(!v||!v.videoWidth)return;
  if(needLeave){
   busy=true;let f=false;try{f=cf().detect&&await hasFace(v)}catch(e){}busy=false;
   if(f&&Date.now()<leaveMax)return;
   needLeave=false;
  }
  scan(true);
 },700);
}

 <div class="seg"><button data-r="today" class="${S.rd==='today'?'on':''}">Hari ini</button><button data-r="all" class="${S.rd==='all'?'on':''}">Semua hari</button></div>
 <div class="card"><div class="row" style="justify-content:space-around;text-align:center">${Object.entries(ST).map(([k,l])=>`<div><b style="font-size:22px">${c[k]}</b><small>${l}</small></div>`).join('')}</div></div>
 <div class="btns"><button class="btn s" id="cp">Salin (Excel)</button><button class="btn" id="dl">Unduh .csv</button></div>
 <div class="card" style="margin-top:12px">${R.slice(0,200).map(r=>`<div class="row"><div class="g">${esc(r.s.name)}<small>${esc(r.s.cls)} · ${r.date}${r.time?' '+r.time:''}</small></div><span class="pill ${r.st}">${ST[r.st]}</span></div>`).join('')||'<div class="row">Belum ada data</div>'}</div>`;
 $('#v').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.rc=b.dataset.k;vRekap()});
 $('#v').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rd=b.dataset.r;vRekap()});
 const csv=()=>'Tanggal,Jam,NIS,Nama,Kelas,Status,Metode\n'+R.map(r=>[r.date,r.time,r.s.nis,r.s.name,r.s.cls,ST[r.st],r.via].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(csv().replace(/,/g,'\t').replace(/"/g,''));toast('Tersalin — tempel ke Excel')}catch(e){toast('Gagal menyalin')}};
 $('#dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv()],{type:'text/csv'}));a.download='rekap-absen-'+(S.rc==='all'?'sekolah':S.rc)+'.csv';a.click()}catch(e){toast('Unduh tidak tersedia, gunakan Salin')}};
}

/* ---------- Setting ---------- */
const ACC=[['','#007aff'],['#34c759','#34c759'],['#af52de','#af52de'],['#ff9500','#ff9500'],['#ff2d55','#ff2d55']];
const FMT={s:v=>v+' dtk',x:v=>(+v).toFixed(2).replace(/0$/,'')+'×',p:v=>Math.round(v*100)+'%',n:v=>v+'%'};
function rng(id,label,min,max,step,val,f){
 return`<div class="row c"><div class="g">${label}</div><b id="${id}v">${FMT[f](val)}</b><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;
}
function bindR(id,f,set){
 const e=$('#'+id);
 e.oninput=()=>{$('#'+id+'v').textContent=FMT[f](+e.value)};
 e.onchange=()=>{set(+e.value);save()};
}
function rngS(id,label,key,hint){
 const [mn,mx,df]=LIM[key],val=cf()[key],pos=(df-mn)/(mx-mn)*100;
 return`<div class="row c"><div class="g">${label}<small>${hint}</small></div><b id="${id}v">${val}%</b><div style="flex-basis:100%;position:relative"><input type="range" id="${id}" min="${mn}" max="${mx}" step="1" value="${val}"><i class="std" style="left:calc(${pos}% + ${(7-pos*.14).toFixed(1)}px)"></i></div><div class="lim"><span>${mn}%</span><button data-rs="${key}" data-id="${id}">▲ Standar ${df}% · atur ulang</button><span>${mx}%</span></div></div>`;
}
function bindS(id,key){
 const e=$('#'+id),t=$('#'+id+'v');
 e.oninput=()=>{t.textContent=e.value+'%'};
 e.onchange=()=>{cf()[key]=+e.value;save()};
 $('[data-rs="'+key+'"]').onclick=()=>{const d=LIM[key][2];e.value=d;t.textContent=d+'%';cf()[key]=d;save()};
}
function sw(id,on){return`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><i></i></label>`}
function vSetting(){
 const c=cf(),n=c.snd;
 $('#v').innerHTML=`<h1>Setting</h1>
 <h3>Tema</h3><div class="card">
  <div style="padding:12px 12px 4px"><div class="seg" style="margin:0">${[['auto','Otomatis'],['light','Terang'],['dark','Gelap']].map(([k,l])=>`<button data-th="${k}" class="${c.theme===k?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="row" style="border:0;padding-bottom:0"><div class="g">Warna aksen</div></div>
  <div class="sws">${ACC.map(([k,col])=>`<button data-ac="${k}" style="background:${col}" class="${c.accent===k?'on':''}" aria-label="Warna ${col}"></button>`).join('')}</div>
 </div>
 <h3>Suara</h3><div class="card">
  <div class="row"><div class="g">Suara aktif<small>Mematikan semua ucapan</small></div>${sw('sOn',n.on)}</div>
  <div class="row c"><div class="g">Pilihan suara</div>${selBtn('vs',n.voice,voiceLabel(),'')}</div>
  ${rng('sRate','Kecepatan bicara',0.5,1.5,0.05,n.rate,'x')}
  ${rng('sPitch','Nada suara',0.5,2,0.05,n.pitch,'x')}
  ${rng('sVol','Volume',0,1,0.05,n.vol,'p')}
  <div class="row"><button class="btn s" id="sTest">▶ Tes suara</button></div>
 </div>
 <h3>Kapan suara berbunyi</h3><div class="card">
  <div class="row c"><div class="g">Siswa hadir<small>Saat wajah cocok & baru absen</small></div>${sw('eH',n.hadir)}<input id="tH" value="${esc(n.tHadir)}"></div>
  <div class="row c"><div class="g">Sudah absen<small>Saat wajah cocok tapi sudah tercatat hadir</small></div>${sw('eD',n.dup)}<input id="tD" value="${esc(n.tDup)}"></div>
  <div class="row c"><div class="g">Wajah tidak dikenali<small>Saat scan gagal</small></div>${sw('eG',n.gagal)}<input id="tG" value="${esc(n.tGagal)}"></div>
 </div><p class="sm">Isi kalimat bisa diubah. Pakai {nama} untuk nama siswa dan {kelas} untuk kelasnya.</p>
 <h3>Scan</h3><div class="card">
  <div class="row"><div class="g">Deteksi wajah<small>Scan hanya jalan kalau ada wajah di dalam cincin</small></div>${sw('dtc',c.detect)}</div>
  <div class="row"><div class="g">Scan otomatis<small>Kamera scan terus tanpa tombol (cocok untuk gerbang)</small></div>${sw('aut',c.auto)}</div>
  ${rng('cool','Jeda setelah berhasil',1,10,1,c.cool,'s')}
 </div><p class="sm">Jika deteksi wajah sering salah (wajah tidak terbaca), matikan. Deteksi ini hanya memastikan ada wajah, bukan pencegah foto.</p>
 <h3>Pencocokan wajah</h3><div class="card">
  ${rngS('thK','Ambang Mode Kelas','thK','Skor minimal agar wajah dianggap cocok')}
  ${rngS('thS','Ambang Mode Sekolah','thS','Skor minimal agar wajah dianggap cocok')}
  ${rngS('gap','Selisih dengan kandidat kedua','gap','Wajah ditolak kalau terlalu mirip siswa lain. 0 = tidak dicek')}
 </div><p class="sm">Garis kecil di slider = nilai standar. Makin tinggi ambang = makin ketat (lebih jarang salah orang, tapi lebih sering "tidak dikenali"). Kalau sering gagal padahal orangnya benar, turunkan sedikit demi sedikit (2–3%) lalu uji.</p>
 <h3>Data</h3><div class="card" style="padding:12px">
  <button class="btn s" id="bk1" style="margin-bottom:8px">Unduh cadangan (.json)</button>
  <button class="btn s" id="rs" style="margin-bottom:8px">Pulihkan dari file cadangan</button>
  <button class="btn s" id="hr" style="margin-bottom:8px;color:var(--red)">Hapus riwayat absen</button>
  <button class="btn r" id="ra">Hapus semua siswa, kelas & riwayat</button>
  <input type="file" id="rf" accept=".json,application/json" style="display:none">
 </div><p class="sm" style="margin-top:10px">Absen Wajah · ${DB.students.length} siswa · ${DB.classes.length} kelas</p>`;
 const v=$('#v');
 v.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{c.theme=b.dataset.th;save();applyTheme();vSetting()});
 v.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>{c.accent=b.dataset.ac;save();applyTheme();vSetting()});
 $('#sOn').onchange=e=>{n.on=e.target.checked;save();if(n.on)speak('Suara aktif');else if('speechSynthesis' in window)speechSynthesis.cancel()};
 bindSel('vs','Pilihan suara',voiceOpts,v=>{n.voice=v;save()});
 bindR('sRate','x',x=>n.rate=x);bindR('sPitch','x',x=>n.pitch=x);bindR('sVol','p',x=>n.vol=x);
 $('#sTest').onclick=()=>{if(!n.on)return toast('Aktifkan suara dulu');speak(fill(n.tHadir,{name:'Budi Santoso',cls:'X IPA 1'}))};
 $('#eH').onchange=e=>{n.hadir=e.target.checked;save()};
 $('#eD').onchange=e=>{n.dup=e.target.checked;save()};
 $('#eG').onchange=e=>{n.gagal=e.target.checked;save()};
 $('#tH').oninput=e=>{n.tHadir=e.target.value;save()};
 $('#tD').oninput=e=>{n.tDup=e.target.value;save()};
 $('#tG').oninput=e=>{n.tGagal=e.target.value;save()};
 $('#dtc').onchange=e=>{c.detect=e.target.checked;save()};
 $('#aut').onchange=e=>{c.auto=e.target.checked;save()};
 bindR('cool','s',x=>c.cool=x);
 bindS('thK','thK');bindS('thS','thS');bindS('gap','gap');
 $('#bk1').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='cadangan-absen-'+today()+'.json';a.click()}catch(e){toast('Unduh tidak tersedia di perangkat ini')}};
 $('#rs').onclick=()=>$('#rf').click();
 $('#rf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.students))throw 0;if(!confirm('Timpa semua data sekarang dengan cadangan ini?'))return;DB=norm(o);save();location.reload()}catch(x){toast('File cadangan tidak valid')}};r.readAsText(f)};
 $('#hr').onclick=()=>{if(confirm('Hapus semua riwayat absen? Siswa & kelas tetap ada.')){DB.att=[];save();toast('Riwayat absen dihapus')}};
 $('#ra').onclick=()=>{if(confirm('Hapus SEMUA siswa, kelas, wajah terdaftar & riwayat absen? Pengaturan tetap.')&&confirm('Yakin? Ini tidak bisa dibatalkan.')){DB.students=[];DB.att=[];DB.classes=[];S.cls=null;S.sc='all';S.rc='all';save();vSetting();toast('Semua data dihapus')}};
}
applyTheme();render();
(function(){const sp=$('#splash');if(!sp)return;let gone=false;
 const end=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),500)};
 sp.onclick=end;setTimeout(end,2900)})();
</script></body></html>
